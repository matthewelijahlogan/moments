<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Stats - Moments</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/personal.css">
</head>
<body class="page-screen">

  <div class="banner-logo">
    <img src="../img/MomentsLogoBanner.png" alt="Moments Banner" class="banner-img" />
  </div>

  <div class="stats-card">
    <h2 class="card-title">Your Stats</h2>
    <div class="stats-grid">
      <div class="stat-box">
        <h3>Highest Rated</h3>
        <p id="stat-highest">--</p>
      </div>
      <div class="stat-box">
        <h3>Moments Taken</h3>
        <p id="stat-total">--</p>
      </div>
      <div class="stat-box">
        <h3>Moments This Month</h3>
        <p id="stat-month">--</p>
      </div>
      <div class="stat-box">
        <h3>Average Rating</h3>
        <p id="stat-average">--</p>
      </div>
    </div>
  </div>

  <script src="../js/personal.js"></script>
</body>
</html>
